# Azure infrastructure pipeline (mirror of terraform.yaml for AWS):
#   pull request -> fmt, tflint (azurerm ruleset), validate, Checkov, plan posted to the PR
#   merge        -> apply azure-dev, gated by the "azure-dev" GitHub environment
# Plan/apply authenticate with Entra federated credentials (ARM_USE_OIDC); they
# start running once the AZURE_* repository variables exist (docs/setup-azure.md).
name: terraform-azure

on:
  pull_request:
    paths: ["infra/terraform-azure/**", ".github/workflows/terraform-azure.yaml", ".tflint-azure.hcl"]
  push:
    branches: [main]
    paths: ["infra/terraform-azure/**"]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  static:
    name: fmt, lint, validate, security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform-azure
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint-azure.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint-azure.hcl" --chdir infra/terraform-azure
      - name: terraform validate (every root module)
        run: |
          for dir in infra/terraform-azure/bootstrap infra/terraform-azure/live/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: infra/terraform-azure
          framework: terraform
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov-azure.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('checkov-azure.sarif') != ''
        with:
          sarif_file: checkov-azure.sarif
          category: checkov-azure

  plan:
    name: plan (${{ matrix.root }})
    if: github.event_name == 'pull_request' && vars.AZURE_TF_PLAN_CLIENT_ID != ''
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_TF_PLAN_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        root: [global, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        id: plan
        working-directory: infra/terraform-azure/live/${{ matrix.root }}
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          [[ $code -eq 1 ]] && exit 1
          echo "changes=$([[ $code -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Comment plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ROOT: ${{ matrix.root }}
          CHANGES: ${{ steps.plan.outputs.changes }}
        working-directory: infra/terraform-azure/live/${{ matrix.root }}
        run: |
          {
            echo "### Terraform plan (Azure): \`$ROOT\` $([[ "$CHANGES" == "true" ]] && echo '(changes)' || echo '(no changes)')"
            echo '<details><summary>Show plan</summary>'
            echo; echo '```'
            grep -E '^(Plan:|No changes|  [#~+-]|Error)' plan.txt | tail -c 60000
            echo '```'; echo '</details>'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

  apply:
    name: apply (azure-dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_TF_APPLY_CLIENT_ID != ''
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: azure-dev
    concurrency:
      group: terraform-azure-dev
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_TF_APPLY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform apply
        working-directory: infra/terraform-azure/live/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
