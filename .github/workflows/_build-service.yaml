# Reusable pipeline shared by every service. Called once per changed service.
name: build-service

on:
  workflow_call:
    inputs:
      service:
        description: Folder under apps/
        required: true
        type: string
      publish:
        description: Push, sign and deploy to dev (main branch only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  SERVICE: ${{ inputs.service }}

jobs:
  test:
    name: test (${{ inputs.service }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Python service
        id: kind
        run: echo "python=$([[ -f apps/$SERVICE/requirements.txt ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.kind.outputs.python == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ inputs.service }}/requirements*.txt
      - name: Lint and unit test
        if: steps.kind.outputs.python == 'true'
        working-directory: apps/${{ inputs.service }}
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
          python -m pytest -q
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < "apps/$SERVICE/Dockerfile"

  build:
    name: build & scan (${{ inputs.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image metadata
        id: meta
        run: |
          # Immutable tag tied to the commit; ECR rejects overwrites anyway
          echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ inputs.service }}
          load: true
          push: false
          tags: local/${{ inputs.service }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ inputs.service }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Vulnerability report for GitHub code scanning
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ inputs.service }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.service }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local/${{ inputs.service }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      # ---- Everything below runs only for main --------------------------
      - name: Configure AWS credentials (OIDC, no stored keys)
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: inputs.publish
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image
        if: inputs.publish
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          image="$REGISTRY/orders/$SERVICE:$TAG"
          docker tag "local/$SERVICE:$TAG" "$image"
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish

      - name: Sign image and attach SBOM attestation (keyless)
        if: inputs.publish
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Identity = this workflow on this repo, recorded in the Rekor transparency log.
          # Kyverno's verify-image-signatures policy checks exactly this identity.
          cosign sign --yes "$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST"

  deploy-dev:
    name: deploy to dev (${{ inputs.service }})
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-dev-bump # serialize commits to the deploy folder
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Bump image tag in the dev overlay
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          file="deploy/overlays/dev/$SERVICE/kustomization.yaml"
          yq -i "(.images[] | select(.name == \"$SERVICE\")).newTag = \"$TAG\"" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "deploy(dev): $SERVICE $TAG"
          # Another service may have bumped dev at the same time: rebase and retry
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
