# Weekly DORA summary in the Actions tab, computed from the same GitHub
# deployment and incident records the in-cluster exporter uses.
name: dora-report

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  issues: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compute DORA metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python platform/config/common/dora/dora_metrics.py --environment prod --format markdown >> "$GITHUB_STEP_SUMMARY"
