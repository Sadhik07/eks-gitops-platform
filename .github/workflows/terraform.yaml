# Infrastructure pipeline:
#   pull request -> fmt, tflint, validate, Checkov, plan per environment (posted to the PR), cost diff
#   merge        -> apply dev, then stage, then prod; each gated by a GitHub environment with reviewers
name: terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yaml", ".checkov.yaml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  static:
    name: fmt, lint, validate, security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir infra/terraform
      - name: terraform validate (every root module)
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/live/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Checkov
        uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12.3136.0
        with:
          directory: infra/terraform
          framework: terraform
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

  plan:
    name: plan (${{ matrix.root }})
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }} # optional: cost diff runs only when set
    strategy:
      fail-fast: false
      matrix:
        root: [global, dev, stage, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform plan
        id: plan
        working-directory: infra/terraform/live/${{ matrix.root }}
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          [[ $code -eq 1 ]] && exit 1
          terraform show -json tfplan > tfplan.json
          echo "changes=$([[ $code -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Comment plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ROOT: ${{ matrix.root }}
          CHANGES: ${{ steps.plan.outputs.changes }}
        working-directory: infra/terraform/live/${{ matrix.root }}
        run: |
          {
            echo "### Terraform plan: \`$ROOT\` $([[ "$CHANGES" == "true" ]] && echo '(changes)' || echo '(no changes)')"
            echo '<details><summary>Show plan</summary>'
            echo; echo '```'
            grep -E '^(Plan:|No changes|  [#~+-]|Error)' plan.txt | tail -c 60000
            echo '```'; echo '</details>'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
      - name: Cost estimate (Infracost)
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Post cost diff
        if: env.INFRACOST_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: infra/terraform/live/${{ matrix.root }}
        run: |
          infracost breakdown --path tfplan.json --format json --out-file /tmp/infracost.json
          infracost comment github --path /tmp/infracost.json --repo "$GITHUB_REPOSITORY" \
            --pull-request "${{ github.event.pull_request.number }}" --github-token "$GH_TOKEN" --behavior update

  apply:
    name: apply (${{ matrix.root }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1 # dev -> stage -> prod, in order
      matrix:
        root: [dev, stage, prod]
    # Each GitHub environment can require reviewers and a wait timer (prod)
    environment: ${{ matrix.root }}
    concurrency:
      group: terraform-${{ matrix.root }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform apply
        working-directory: infra/terraform/live/${{ matrix.root }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
