# Promotes the exact image already running in one environment to the next by
# opening a pull request. Promotion to prod needs CODEOWNERS approval, so every
# production change is a reviewed, revertible Git commit.
name: promote

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to promote
        type: choice
        options: [api, worker, web, all]
        required: true
      from:
        description: Source environment
        type: choice
        options: [dev, stage]
        default: dev
      to:
        description: Target environment
        type: choice
        options: [stage, prod]
        default: stage

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Validate direction
        run: |
          if [[ "$FROM" == "$TO" || ( "$FROM" == "dev" && "$TO" == "prod" ) ]]; then
            echo "::error::Promotions go dev -> stage -> prod, one step at a time"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Copy tags and verify signatures
        id: copy
        env:
          REPO: ${{ github.repository }}
        run: |
          services=$([[ "$SERVICE" == "all" ]] && echo "api worker web" || echo "$SERVICE")
          summary=""
          for svc in $services; do
            src="deploy/overlays/$FROM/$svc/kustomization.yaml"
            dst="deploy/overlays/$TO/$svc/kustomization.yaml"
            tag=$(yq ".images[] | select(.name == \"$svc\") | .newTag" "$src")
            image=$(yq ".images[] | select(.name == \"$svc\") | .newName" "$src"):$tag
            # Refuse to promote anything this repo's CI did not sign
            cosign verify "$image" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/$REPO/.github/workflows/" > /dev/null
            yq -i "(.images[] | select(.name == \"$svc\")).newTag = \"$tag\"" "$dst"
            summary+="- \`$svc\`: \`$tag\` (signature verified)"$'\n'
          done
          { echo "summary<<EOF"; echo "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: promote/${{ inputs.to }}-${{ inputs.service }}
          title: "promote(${{ inputs.to }}): ${{ inputs.service }} from ${{ inputs.from }}"
          commit-message: "promote(${{ inputs.to }}): ${{ inputs.service }} from ${{ inputs.from }}"
          labels: promotion, ${{ inputs.to }}
          body: |
            Promotes the images currently running in **${{ inputs.from }}** to **${{ inputs.to }}**.

            ${{ steps.copy.outputs.summary }}
            Before merging, check that the `${{ inputs.from }}` canary completed and the
            SLO dashboard shows no burn. ArgoCD deploys this to `${{ inputs.to }}` with
            an automated canary after merge.
