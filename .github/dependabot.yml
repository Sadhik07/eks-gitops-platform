# Keeps pinned GitHub Action SHAs, Python deps, base images and Terraform
# providers current. Helm chart versions in platform/addons are updated by
# Renovate (renovate.json), which understands ArgoCD Application manifests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directories: ["/apps/api", "/apps/worker"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/worker", "/apps/web"]
    schedule: { interval: weekly }
  # Provider major versions break the pinned community modules (e.g. EKS module
  # v20 needs AWS provider v5), so majors are upgraded deliberately, not by bot.
  - package-ecosystem: terraform
    directories: ["/infra/terraform/live/*", "/infra/terraform/modules/*"]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directories: ["/infra/terraform-azure/live/*", "/infra/terraform-azure/modules/*", "/infra/terraform-azure/bootstrap"]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
