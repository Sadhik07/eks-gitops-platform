apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: api-secrets
    creationPolicy: Owner
  # Every key in the JSON secret orders/<env>/api becomes an env var on the API.
  # The environment is patched in by each overlay.
  dataFrom:
    - extract:
        key: orders/ENV/api
