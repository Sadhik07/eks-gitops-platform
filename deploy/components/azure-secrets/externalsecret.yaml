apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: api-secrets
    creationPolicy: Owner
  # The Key Vault secret "orders-api" holds JSON; every key becomes a file under
  # /var/run/secrets/orders/ in the API pods (same contract as on AWS).
  dataFrom:
    - extract:
        key: orders-api
