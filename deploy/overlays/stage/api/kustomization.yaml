apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - ../../../base/api
components:
  - ../../../components/aws-secrets
images:
  - name: api
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders/api
    newTag: bootstrap # promoted from dev by the "promote" workflow
configMapGenerator:
  - name: api-config
    literals:
      - ENVIRONMENT=stage
      - AWS_REGION=us-east-1
      - QUEUE_URL=https://sqs.us-east-1.amazonaws.com/123456789012/orders-stage-orders
      - LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability.svc:4317
patches:
  - target: { kind: ExternalSecret, name: api-secrets }
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: orders/stage/api
