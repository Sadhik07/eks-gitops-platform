apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - ../../../base/worker
images:
  - name: worker
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders/worker
    newTag: bootstrap
configMapGenerator:
  - name: worker-config
    literals:
      - ENVIRONMENT=prod
      - AWS_REGION=us-east-1
      - QUEUE_URL=https://sqs.us-east-1.amazonaws.com/123456789012/orders-prod-orders
      - LOG_LEVEL=INFO
patches:
  - target: { kind: Deployment, name: worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
