apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - ../../../base/web
images:
  - name: web
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders/web
    newTag: bootstrap
patches:
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
