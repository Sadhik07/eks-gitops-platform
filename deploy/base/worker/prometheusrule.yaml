apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: worker
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: worker.alerts
      rules:
        # Freshness SLO: orders are picked up within 5 minutes of being queued
        - alert: WorkerQueueBacklog
          expr: max(worker_oldest_message_age_seconds) > 300
          for: 5m
          labels:
            severity: page
            service: worker
          annotations:
            summary: Orders are waiting more than 5 minutes to be processed
        - alert: WorkerHighFailureRate
          expr: |
            sum(rate(worker_messages_processed_total{result="error"}[10m]))
            / clamp_min(sum(rate(worker_messages_processed_total[10m])), 1e-9) > 0.05
          for: 10m
          labels:
            severity: ticket
            service: worker
          annotations:
            summary: More than 5% of orders fail processing (check the DLQ)
        - alert: WorkerNotPolling
          expr: time() - max(worker_last_poll_timestamp_seconds) > 120
          for: 5m
          labels:
            severity: page
            service: worker
          annotations:
            summary: No worker has polled the queue for over 2 minutes
