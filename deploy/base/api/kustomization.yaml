apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: orders
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - service.yaml
  - rollout.yaml
  - analysistemplate.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
configurations:
  - kustomizeconfig.yaml
