# Three-node kind cluster with zone labels so topology spread and PDBs behave
# like a multi-AZ EKS cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orders
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
