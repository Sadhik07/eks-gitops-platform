apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      valuesObject:
        # Single-binary mode with filesystem storage keeps the lab cheap.
        # For production, switch to SimpleScalable mode with an S3 bucket.
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: index_, period: 24h }
        singleBinary:
          replicas: 1
          persistence:
            size: 20Gi
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
