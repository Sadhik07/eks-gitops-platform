apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAMENAME/eks-gitops-platform.git
    targetRevision: main
    path: platform/policies
    directory:
      exclude: "tests/*"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
