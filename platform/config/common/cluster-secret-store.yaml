# Reads from AWS Secrets Manager using the External Secrets controller's
# Pod Identity role, which Terraform scopes to secrets under orders/<env>/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
  # Only these namespaces may create ExternalSecrets against this store
  conditions:
    - namespaces: ["orders", "monitoring"]
