apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storageclass.yaml
  - cluster-secret-store.yaml
  - dora-exporter.yaml
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/service-slo.json
      - dashboards/dora.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dora-exporter-script
    namespace: monitoring
    files:
      - dora/dora_metrics.py
