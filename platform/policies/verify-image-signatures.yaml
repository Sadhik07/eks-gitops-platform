# Supply-chain gate: images from our ECR or ACR must be signed by THIS repository's
# GitHub Actions workflows (Sigstore keyless / cosign). An image pushed by hand,
# or by any other repo, is rejected at admission. Tags are also rewritten to
# immutable digests so what was verified is exactly what runs.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify image signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: require-github-actions-signature
      match:
        any:
          - resources:
              kinds: ["Pod"]
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/orders/*" # AWS (EKS)
            - "*.azurecr.io/orders/*" # Azure (AKS)
          imageRegistryCredentials:
            # Kyverno's cloud identity grants registry read: EKS Pod Identity on AWS,
            # Entra Workload ID on Azure (both created in Terraform)
            helpers: ["amazon", "azure"]
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/YOUR_GITHUB_USERNAMENAME/eks-gitops-platform/.github/workflows/*
                    rekor:
                      url: https://rekor.sigstore.dev
