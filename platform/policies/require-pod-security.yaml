apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security
  annotations:
    policies.kyverno.io/title: Require hardened pod security context
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Application pods must run as non-root, cannot escalate privileges, must
      drop all Linux capabilities and may not use host namespaces.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["orders"]
      validate:
        message: "Pods must set securityContext.runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: no-privilege-escalation-drop-all
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["orders"]
      validate:
        message: "Containers must set allowPrivilegeEscalation: false and drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
    - name: no-host-namespaces-or-privileged
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["orders"]
      validate:
        message: "Host namespaces and privileged containers are not allowed."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
            containers:
              - =(securityContext):
                  =(privileged): false
