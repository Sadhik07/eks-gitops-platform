apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-images
  annotations:
    policies.kyverno.io/title: Trusted registries and pinned tags
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: trusted-registry-only
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["orders"]
      validate:
        message: "Images in the orders namespace must come from our ECR (AWS) or ACR (Azure) registry."
        pattern:
          spec:
            containers:
              - image: "*.dkr.ecr.*.amazonaws.com/orders/* | *.azurecr.io/orders/*"
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["orders"]
      validate:
        message: "The ':latest' tag (or no tag) is not allowed; deploy an immutable tag."
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@') }}"
                    operator: Equals
                    value: false
