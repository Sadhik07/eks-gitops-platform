apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: orders
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders/api:3f9c2a1
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 256Mi }
      livenessProbe:
        httpGet: { path: /healthz, port: 8080 }
        periodSeconds: 10
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: runs-as-root
  namespace: orders
spec:
  securityContext:
    runAsNonRoot: false
  containers:
    - name: app
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders/api:3f9c2a1
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 256Mi }
      livenessProbe:
        httpGet: { path: /healthz, port: 8080 }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: orders
spec:
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders/api:3f9c2a1
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 256Mi }
      livenessProbe:
        httpGet: { path: /healthz, port: 8080 }
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Pod
metadata:
  name: no-limits
  namespace: orders
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders/api:3f9c2a1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: docker-hub-latest
  namespace: orders
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: nginx:latest
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 256Mi }
      livenessProbe:
        httpGet: { path: /, port: 80 }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
