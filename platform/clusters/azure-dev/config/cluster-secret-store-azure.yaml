# Reads from Azure Key Vault using the External Secrets controller's Workload
# Identity, which Terraform grants "Key Vault Secrets User" on this vault only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-sadhik07-dev.vault.azure.net/
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
  conditions:
    - namespaces: ["orders", "monitoring"]
