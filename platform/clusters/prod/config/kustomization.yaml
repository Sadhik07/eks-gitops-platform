apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../config/common
  - ../../../config/karpenter
patches:
  - target: { kind: EC2NodeClass, name: default }
    patch: |-
      - op: replace
        path: /spec/role
        value: KarpenterNode-orders-prod
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: orders-prod
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: orders-prod
  - target: { kind: ExternalSecret, name: dora-github-token }
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: orders/prod/dora-github-token
  # Prod: higher spend ceiling, gentler disruption budget
  - target: { kind: NodePool, name: general }
    patch: |-
      - op: replace
        path: /spec/limits/cpu
        value: "128"
      - op: replace
        path: /spec/disruption/budgets/0/nodes
        value: "5%"
