apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../addons
patches:
  - target: { kind: Application, name: karpenter }
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/settings/clusterName
        value: orders-prod
      - op: replace
        path: /spec/source/helm/valuesObject/settings/interruptionQueue
        value: karpenter-orders-prod
  - target: { kind: Application, name: velero }
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/configuration/backupStorageLocation/0/bucket
        value: orders-prod-velero-123456789012
  - target: { kind: Application, name: platform-config }
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/clusters/prod/config
  - target: { kind: ApplicationSet, name: orders }
    patch: |-
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: deploy/overlays/prod/*
  # Prod: no automatic pruning of workloads; deletions need a human sync
  - target: { kind: ApplicationSet, name: orders }
    patch: |-
      - op: replace
        path: /spec/template/spec/syncPolicy/automated/prune
        value: false
